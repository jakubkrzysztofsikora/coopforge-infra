# LiteLLM gateway configuration.
# Per-member token-bucket + DRR scheduling. Re-rendered every 60s by
# key-signer from the coops D1 database, so caps always match reality.
#
# Routing strategy:
#   - All members of a coop hit /v1/chat/completions on the gateway.
#   - The gateway forwards to the single vLLM backend for that coop's tier.
#   - Per-key rpm/tpm caps enforce the coop's per-member fair-share.
#   - DRR balances across members so one heavy user can't starve the rest.
#
# Per-tier per-member budgets are derived from total throughput / member_quota
# (see lib/coop-rules.ts defaultFairUse), so caps are honest, not aspirational.

model_list:
  - model_name: "qwen3.6-35b-a3b"
    litellm_params:
      model: "openai/qwen3.6-35b-a3b"
      api_base: "http://vllm:8000/v1"
      api_key: "not-required"
  - model_name: "qwen3.8-27b"
    litellm_params:
      model: "openai/qwen3.8-27b"
      api_base: "http://vllm:8000/v1"
      api_key: "not-required"
  - model_name: "qwen3-235b"
    litellm_params:
      model: "openai/qwen3-235b"
      api_base: "http://vllm:8000/v1"
      api_key: "not-required"
  - model_name: "qwen3-coder-30b-a3b"
    litellm_params:
      model: "openai/qwen3-coder-30b-a3b"
      api_base: "http://vllm:8000/v1"
      api_key: "not-required"
  - model_name: "deepseek-v4-flash"
    litellm_params:
      model: "openai/deepseek-v4-flash"
      api_base: "http://vllm:8000/v1"
      api_key: "not-required"

# The tiers each route serves, keyed by model_name. A route with no tier has no
# box to run it, so it is a stale route and not a tier that has yet to ship.
model_tiers:
  qwen3.6-35b-a3b: ["everyday-fr-l40s", "pro-fr-2x-l40s", "everyday-96g"]
  qwen3.8-27b: ["power-h100"]
  qwen3-235b: ["studio-4x-h100"]
  qwen3-coder-30b-a3b: ["seed-24g"]
  deepseek-v4-flash: ["deepseek-v4-flash"]

router_settings:
  routing_strategy: "usage-based-routing-v2"  # DRR
  num_retries: 1
  timeout: 600
  enable_caching: false  # agentic traffic is rarely cacheable
  caching_groups: []

litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  service_callbacks: ["prometheus"]

general_settings:
  database_url: "postgresql://litellm:litellm@litellm-db:5432/litellm"
  master_key: "os.environ/LITELLM_MASTER_KEY"
  proxy_batch_write_at: 5
  disable_spend_logs: false

# Per-tier per-member caps (tokens per minute), keyed by tier id from
# lib/coop-rules.ts SPECS. `tpm` is `tpm_cap_per_member`, `parallelism` is
# `concurrency_per_member`. Burst is 2x steady-state; refill is linear over the
# month. Generated into keys by key-signer from coops D1.
per_tier_budgets:
  everyday-fr-l40s: { tpm: 120000, rpm: 60, burst: 2.0, parallelism: 3 }
  pro-fr-2x-l40s:   { tpm: 150000, rpm: 60, burst: 2.0, parallelism: 4 }
  power-h100:       { tpm: 150000, rpm: 60, burst: 2.0, parallelism: 4 }
  studio-4x-h100:   { tpm: 50000,  rpm: 60, burst: 2.0, parallelism: 1 }
  seed-24g:         { tpm: 120000, rpm: 60, burst: 2.0, parallelism: 3 }
  everyday-96g:     { tpm: 150000, rpm: 60, burst: 2.0, parallelism: 4 }
  deepseek-v4-flash: { tpm: 100000, rpm: 60, burst: 2.0, parallelism: 2 }

# Mesh membership: one node is one box serving one tier, and `weight` is the
# share of that tier's traffic it carries against its in-service peers. A node
# joins the mesh when provisioning registers it and leaves it when
# `failures_before_rotation` consecutive probes of `health_check.path` fail —
# liveness lives in `registry` (gitignored), so rotation never edits this file.
# `endpoint` is the address the gateway routes to; a registered node's own
# address takes precedence while it is in service, so a re-provisioned box
# needs no manifest edit either.
mesh:
  registry: "state/gateway-nodes.json"
  health_check:
    path: "/health"
    interval_seconds: 30
    timeout_seconds: 5
    failures_before_rotation: 3
  nodes:
    - id: "seed-24g-01"
      tier: "seed-24g"
      endpoint: "http://seed-24g-01:8000"
      weight: 1
    - id: "everyday-96g-01"
      tier: "everyday-96g"
      endpoint: "http://everyday-96g-01:8000"
      weight: 1
